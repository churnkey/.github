name: Claude Code Review (Reusable)

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: "Claude Code OAuth token for PR reviews"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} and post your review using `gh pr comment`.

            **Before reviewing:**
            1. Read REVIEW.md if present — it defines severity for this repo
            2. Read the PR description to understand intent
            3. Examine the full diff — only flag issues visible in the diff, not pre-existing code

            **Rules:**
            - Every finding needs a file:line citation pointing to the exact problem in the diff
            - Do not speculate about issues without a direct line reference
            - Skip anything CI already enforces (lint, types, formatting)

            **Review Format:**

            ## ⭐ Rating: [X]/5
            [One sentence: what this PR does + why this rating]

            ## 🔴 Critical (security, data loss, breaking changes)
            ## 🟠 High (bugs, incorrect logic)
            ## 🟡 Medium (maintainability — max 3 items)
            [Use file:line references. Skip empty sections. If nothing critical, keep it short.]

            Post using:
            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body "$(cat <<'EOF'
            [your review here]
            EOF
            )"
            ```

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
