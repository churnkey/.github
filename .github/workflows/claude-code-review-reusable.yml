name: Claude Code Review (Reusable)

on:
  workflow_call:
    inputs:
      allowed_bots:
        required: false
        type: string
        default: "cursor"
        description: "Comma-separated list of bot actors allowed to trigger the review (or '*' for all). Defaults to Cursor so bot-opened PRs are reviewed. Avoid '*' on public repos."
      show_full_output:
        required: false
        type: boolean
        default: false
        description: "Print Claude's full SDK output in the job log. Leave off normally: the log would carry every tool result, and the PR head is untrusted. Turn on temporarily when a review fails and the summary alone doesn't say why — without it the action reports only is_error/num_turns/cost and redacts the message. Rerunning with --debug does NOT lift that redaction."
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: "Claude Code OAuth token for PR reviews"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
          show_full_output: ${{ inputs.show_full_output }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} and post your review using `gh pr comment`.

            **Before reviewing:**
            1. Read REVIEW.md if present — it defines severity for this repo
            2. Read the PR description to understand intent
            3. Examine the full diff — only flag issues visible in the diff, not pre-existing code

            **Process: draft → validate → filter → post**

            Do these steps in order. Do not skip the validation step. Under-reporting is better than over-reporting — false positives erode trust and waste reviewer time.

            1. **Draft findings privately.** Make an internal list of every issue you'd flag. For each one, record: severity bucket, file:line in the diff, and a one-sentence reason. Do not post yet.

            2. **Validate every drafted finding before posting.** The full repo is checked out and you have `Read`, `Grep`, and `Glob` available — use them to look outside the diff when it would change the verdict on a finding. Investigate with purpose: only look outside the diff when you have a specific question that would confirm or refute the issue (e.g. "is this function awaited at any callsite?", "is this symbol defined in the imported module?", "does this config key exist elsewhere?"). Don't go fishing.

               For each finding, answer honestly:
               - Does the cited line actually contain the problem I described? If you can't point to specific tokens in the diff that prove the issue, drop it.
               - Is this a real defect, or just a style/quality opinion? Drop opinions.
               - Does this depend on context outside the diff (caller behavior, related files, config)? Go check that context — read the relevant files, grep for usages, look at the surrounding code. If after checking you still can't confirm the issue, drop it.
               - Is this something CI already enforces (lint, types, formatting)? Drop it.
               - Is this a pedantic nitpick a senior engineer wouldn't raise? Drop it.
               - Is this a pre-existing issue not introduced by the diff? Drop it — only flag what this PR introduces or makes worse. Use `git blame` or `git log` on the cited lines if you're unsure whether the diff introduced the problem.

            3. **Keep only HIGH-SIGNAL survivors.** A finding survives only if at least one of these is true:
               - The code will fail to compile or parse (syntax errors, type errors, missing imports, unresolved references)
               - The code will definitely produce wrong results regardless of inputs (clear logic error)
               - There's a concrete security or data-loss risk traceable to a specific line in the diff
               - A documented project convention (REVIEW.md, CLAUDE.md) is unambiguously violated, and you can quote the rule

               If you're not confident the issue is real, drop it.

            4. **Post the review using only the surviving findings.**

            **Rules:**
            - Every finding needs a file:line citation pointing to the exact problem in the diff
            - Do not speculate about issues without a direct line reference
            - Skip anything CI already enforces (lint, types, formatting)

            **Review Format:**

            ## ⭐ Rating: [X]/5
            [One sentence: what this PR does + why this rating]

            ## 🔴 Critical (security, data loss, breaking changes)
            ## 🟠 High (bugs, incorrect logic)
            ## 🟡 Medium (maintainability — max 3 items)
            [Use file:line references. Skip empty sections. If nothing critical, keep it short. If no findings survive validation in any bucket, say "No high-signal issues found."]

            Post using:
            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body "$(cat <<'EOF'
            [your review here]
            EOF
            )"
            ```

          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*)"'
